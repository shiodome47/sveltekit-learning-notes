# Netlify build configuration for the monorepo.
# The SvelteKit app lives at apps/web/. We tell Netlify to cd there
# (base = "apps/web") so adapter-netlify's auto-detected output
# (apps/web/build + apps/web/.netlify/functions-internal) is found.

[build]
  base = "apps/web"
  command = "bun run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# adapter-netlify v6 emits the SSR catch-all function (Functions v2 with
# `path: ["/*"]`) into .netlify/functions-internal/. Netlify usually
# auto-detects this, but in monorepos the auto-detection sometimes
# misses it. We point to it explicitly as a safety net.
[functions]
  directory = ".netlify/functions-internal"
